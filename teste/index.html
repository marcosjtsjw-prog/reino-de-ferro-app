<style>

:root{color-scheme:light dark;
 --bg:light-dark(#eef4ff,#0e1320);--card:light-dark(#fff,#18203a);--ink:light-dark(#151a26,#eef1f8);
 --mute:light-dark(#566079,#a2abc4);--line:light-dark(#d7e0f0,#2b3656);--azul:#1d5fe0;--azul2:light-dark(#e2ebff,#1f2b4f);
 --verm:#e0352b;--ouro:#f2b705;--ok:#1fae5b}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;overflow-x:clip;padding-bottom:88px}
h1,h2,h3{font-family:Cinzel,Georgia,serif;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:24px;margin:20px 0 10px}h3{font-size:16px}
button{font:inherit;font-weight:700;min-height:44px;padding:8px 12px;border-radius:10px;border:0;background:var(--azul);color:#fff;cursor:pointer}
button:disabled{opacity:.4;cursor:default}button.sec{background:var(--azul2);color:var(--ink)}button.perigo{background:var(--verm)}
button:focus-visible,select:focus-visible{outline:3px solid var(--ouro);outline-offset:2px}
select{font:inherit;font-size:16px;min-height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 10px}
.topo{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:6px max(4vw,12px);border-bottom:3px solid var(--ouro);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topo h1{font-size:17px;margin-right:auto}
.recs{display:flex;gap:5px;flex-wrap:wrap}
.rec{font-size:14px;font-weight:700;background:rgba(255,255,255,.16);border-radius:20px;padding:1px 9px;white-space:nowrap;font-variant-numeric:tabular-nums}
.rec.cheio{background:rgba(224,53,43,.85)}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:0}
main{max-width:760px;margin:0 auto;padding:0 max(4vw,12px)}
.cena{display:block;margin:0 calc(-1 * max(4vw,12px));width:calc(100% + 2 * max(4vw,12px));height:240px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.lin{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mute{color:var(--mute);font-size:14px}.falta{color:var(--verm)}
.barra{height:7px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:5px;width:100%}.barra i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:0 8px;border-radius:20px;color:#fff;white-space:nowrap}
.poder{font-family:Cinzel,serif;font-weight:800;font-size:19px;white-space:nowrap}
.botoes{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;justify-content:flex-end}
.fig{display:block;width:100%;height:auto}
.heroi{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center}
.inis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.inis .card{text-align:center;margin:0}.inis .fig{max-width:100px;margin:0 auto}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;text-align:center}.vs .poder{font-size:26px}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.sub{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.item{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center}.mini{width:40px;height:auto;display:block}
.pips i{display:inline-block;width:13px;height:6px;border-radius:3px;margin-right:2px;vertical-align:middle}
.slot{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid var(--mute);vertical-align:-2px;margin-right:2px}
.abas{position:fixed;bottom:0;left:0;right:0;z-index:6;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}

.modal{position:fixed;inset:0;z-index:10;background:rgba(5,10,30,.6);display:flex;align-items:flex-end;justify-content:center}
.modal[hidden]{display:none}
.caixa{background:var(--card);width:min(560px,100%);max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 14px 22px;border-top:5px solid var(--ouro)}
.modal.full{align-items:stretch}.modal.full .caixa{max-height:none;height:100%;border-radius:0;width:min(640px,100%);display:flex;flex-direction:column;gap:8px;padding-top:12px}
.time{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lt{background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:5px 4px;font-weight:400;display:flex;flex-direction:column;align-items:center;gap:1px;text-align:center;font-size:13px;line-height:1.2}
.lt .fig{max-width:70px}.lt b{font-size:13px}.lt small{font-size:13px;color:var(--mute)}.lt .int{color:var(--ink);font-weight:700}

.lt:disabled{opacity:.3}
.log{font-size:14px;height:76px;overflow:hidden;border-block:1px solid var(--line);padding:4px 0}.log p{margin:1px 0}.log p:first-child{font-weight:700}
.acoes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.painel{margin-top:auto}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#151a26;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.revela{text-align:center}.revela .fig{max-width:170px;margin:0 auto}
@keyframes surge{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.revela .fig,.lt.sel .fig{animation:surge .45s ease-out}
@media(prefers-reduced-motion:reduce){.revela .fig,.lt.sel .fig{animation:none}.barra i{transition:none}}

.missao{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}

.grade2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}

.abas button{position:relative}.abas button.badge::after{content:'';position:absolute;top:5px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--verm)}
.acoes{grid-template-columns:repeat(3,minmax(0,1fr))}

.abas{grid-template-columns:repeat(6,minmax(0,1fr))}.abas button{font-size:13px;padding:6px 0}
input[type=text],input:not([type]){font:inherit;font-size:16px;min-height:44px;width:100%;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px}
.av{display:inline-block;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--azul2);border:2px solid var(--ouro);flex:none}

.cmdcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}

.previa{background:var(--azul2);border-radius:14px}.campos{display:grid;gap:8px}
.cor{width:34px;height:34px;min-height:34px;padding:0;border-radius:50%;border:3px solid transparent}.cor.on{border-color:var(--ouro)}
.sistemas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:6px}
.sistemas button{display:flex;flex-direction:column;align-items:flex-start;text-align:left}.sistemas small{font-weight:400;font-size:13px;opacity:.85}
.botao-arq{display:inline-flex;align-items:center;min-height:44px;padding:8px 12px;border-radius:10px;background:var(--azul);color:#fff;font-weight:700;cursor:pointer}
.botao-arq.sec{background:var(--azul2);color:var(--ink)}
.gcol{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-bottom:10px}
.gmini{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:400;display:flex;flex-direction:column;align-items:center;padding:4px;font-size:13px;line-height:1.2}
.gmini svg{max-width:64px}.gmini small{color:var(--mute);font-size:12px}
.chat{display:grid;gap:10px;margin-bottom:12px}
.msg{display:flex;gap:8px;align-items:flex-end}.msg p{margin:0;padding:10px 12px;border-radius:14px;max-width:82%;font-size:15px}

.tropa input{width:100%}
input[type=number]{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 8px}
.mapa{display:block;width:100%;height:auto;margin:6px 0 10px;border-radius:14px}
.alerta{border:2px solid var(--verm);background:light-dark(#fff1f0,#3a1616)}

.plano b{display:block;margin-top:6px;font-size:14px}.plano .sub{margin:4px 0 2px}.plano .sub button{min-height:40px;font-size:14px;padding:6px 10px}
.lt.morto{opacity:.35}

.painel2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ficha{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--azul);border-radius:12px;padding:8px 10px;margin-bottom:6px;font-size:14px}
.ficha.ini{border-left-color:var(--verm)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 8px;margin:4px 0;color:var(--mute);font-size:13px}.stats b{color:var(--ink)}
.habs{list-style:none;margin:2px 0 0;padding:0;font-size:13px}.habs li{margin:2px 0}

.tag-c.c-defesa{background:#1d5fe0}.tag-c.c-suporte{background:#1fae5b}
.escolha{display:flex;flex-wrap:wrap;gap:6px}.comp{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:14px}.comp small{font-weight:400;font-size:12px;opacity:.85}
.gmini.on{border:2px solid var(--ouro)}
@media(max-width:560px){.painel2{grid-template-columns:minmax(0,1fr)}}

.painel-l{border-top:1px solid var(--line);padding:8px 0}.stats{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px}.prob{border:2px solid var(--line)}
.cenawrap{overflow-x:auto;overflow-y:hidden;margin:0 calc(-1 * max(4vw,12px));-webkit-overflow-scrolling:touch;scrollbar-width:none}.cenawrap::-webkit-scrollbar{display:none}.cenawrap .cena{margin:0;width:max(700px,100%);height:auto;aspect-ratio:3.5/1}.pr{cursor:pointer}.pr:active{opacity:.75}
.bpeq{min-height:36px!important;padding:4px 12px!important;font-size:14px!important;white-space:nowrap;flex:0 0 auto}.duelo{display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:4px}.duelo i{display:block}.eq{display:flex;flex-wrap:wrap;margin:6px 0 4px;gap:6px}.pl{border-top:1px solid var(--line);padding:8px 0 4px}.sels{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}.sels select{min-height:38px;font-size:14px;padding:4px 8px}.kit{font-size:13px;display:flex;align-items:center;gap:4px}.kit input{width:18px;height:18px}.lut{border-top:1px solid var(--line);padding:6px 0}.mbs{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;margin:4px 0}.mb{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:6px;font-size:12px}.mb em{font-style:normal;color:var(--mute,#667)}.mb .barra{margin:0;height:7px}.mb b{font-size:12px;min-width:28px;text-align:right}.hb{font-size:12px}.vant{color:var(--ok);font-weight:700;font-size:13px;margin-right:4px}.desv{color:var(--verm);font-weight:700;font-size:13px;margin-right:4px}
.ggrade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gtile{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card);color:var(--ink);border:3px solid;border-radius:14px;padding:6px 4px;min-height:0;font-weight:400}.gtile .gfig{width:100%;max-width:92px;display:block}.gtile .gfig svg{width:100%;height:auto}.gtile b{font-size:13px;line-height:1.2;text-align:center}.gtile small{font-size:11px;color:var(--mute)}.gst{position:absolute;top:4px;right:6px;font-size:14px}.gnovo{position:absolute;top:4px;left:6px;font-size:10px;background:var(--verm);color:#fff;border-radius:6px;padding:1px 5px}.gcab{margin:14px 0 6px}.hgrade{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}.hcel{background:var(--azul2);border-radius:10px;padding:6px 4px;text-align:center}.hcel b{display:block;font-size:17px}.hcel small{font-size:11px;line-height:1.1;display:block;color:var(--mute)}.inv{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}.inv:first-child{border-top:0}.tab{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}.tab th,.tab td{text-align:left;padding:5px 4px;border-top:1px solid var(--line)}.tab th{font-size:12px;color:var(--mute)}.fil{margin:6px 0}.fil button{min-height:34px;font-size:13px;padding:4px 10px}.aldeia{margin:8px calc(-1 * max(4vw,12px)) 0}.cena2{display:block;width:100%;max-width:640px;height:auto;margin:0 auto}.paineis{display:grid;grid-template-columns:1fr;gap:0}@media(min-width:700px){.paineis{grid-template-columns:1fr 1fr;gap:0 10px}}.prodl{display:grid;grid-template-columns:auto 1fr auto;gap:2px 6px;align-items:center;padding:4px 0}.prodl .barra{grid-column:1/-1;margin:0;height:6px}.prodl>.mute{grid-column:1/-1}.tarefa{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;border:2px solid var(--ouro)}.tarefa.pronta{background:#fff7dc }to{opacity:1}}.cenabox{width:100%;max-width:520px;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));color:#fff}.cenatit{text-align:center;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#f2b705;font-weight:800}.cenafig{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}.cenafig svg{height:100%;max-height:48vh;width:auto;filter:drop-shadow(0 10px 30px rgba(242,183,5,.25))}.cenafala{background:rgba(14,18,27,.92);border:2px solid #f2b705;border-radius:16px;padding:14px 16px;margin-top:-10px}.cenafala b{display:block;font-size:18px;color:#f2b705}.cenafala .mute{color:#9fb0cc;font-size:12px}.cenafala p{font-size:17px;line-height:1.5;margin:8px 0 6px}.cenapag{display:flex;gap:6px;justify-content:center}.cenapag i{width:8px;height:8px;border-radius:50%;background:#55648a}.cenapag i.on{background:#f2b705}.cenabt{display:flex;gap:10px;margin-top:12px}.cenabt button{flex:1;min-height:52px;font-size:17px}.cenabt .sec{flex:0 0 32%}.lore summary{cursor:pointer;font-weight:700;padding:6px 0}.lore p{margin:4px 0 8px;color:var(--ink);font-size:14px;line-height:1.5}.marcos{display:flex;gap:4px}.marco{width:22px;height:22px;border-radius:50%;border:2px solid #e0457b;color:#e0457b;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}.marco.on{background:#e0457b;color:#fff}.mapa{display:block;width:100%;height:auto;border-radius:14px}.arvore{display:block;width:100%;height:auto}.tecdet{border:2px solid var(--ouro)}#abas button{font-size:11px!important;padding:6px 0!important;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root,:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark;--bg:#0b0e15;--card:#151a24;--ink:#eef0f5;--mute:#9aa3b5;--line:#2a3140;--azul:#c0631c;--azul2:#232a38;--verm:#d8352a;--ouro:#f2b705;--ok:#2fbf6a}
body{background:radial-gradient(ellipse at 50% -10%,#2a1a14 0%,#0b0e15 55%) fixed,#0b0e15}

button{background:linear-gradient(#d9772a,#a9511a);border:1px solid #f2b70566;box-shadow:inset 0 1px 0 #ffffff30,0 2px 0 #00000060;text-shadow:0 1px 0 #0006}

.abas{background:linear-gradient(180deg,#171c26,#0d1017);border-top:2px solid #f2b70588}

.caixa{background:linear-gradient(180deg,#1a202c,#11151d);color:var(--ink)}
.tarefa{border:1px solid var(--ouro);background:linear-gradient(90deg,#2a1e10,#161b25)}.tarefa.pronta{background:linear-gradient(90deg,#3b2c0e,#1d2416)}
.gtile.bloq{background:#1a1f29}
input{background:#0e121a;color:var(--ink);border:1px solid var(--line);border-radius:10px;min-height:42px;padding:6px 10px;font:inherit}

.perfil{display:flex;align-items:center;gap:6px;background:linear-gradient(#262d3b,#161b25)!important;border:1px solid #f2b70588;border-radius:24px;padding:2px 10px 2px 2px;min-height:40px;margin-right:auto;color:#fff;box-shadow:none}

.pfnv{background:var(--ouro);color:#1a1205;font-weight:900;font-size:12px;border-radius:10px;padding:0 6px;line-height:18px;text-shadow:none}

.basegrid{display:grid;grid-template-areas:"topo" "cid" "resto";gap:0;margin-top:8px}
.btopo{grid-area:topo}.bresto{grid-area:resto}.cidbox{grid-area:cid;min-width:0}
.cidwrap{overflow-x:auto;overflow-y:hidden;margin:0 calc(-1 * max(4vw,12px));-webkit-overflow-scrolling:touch;scrollbar-width:none;border-top:1px solid #f2b70544;border-bottom:1px solid #f2b70544;background:#07090f;cursor:grab}

.cidsvg{display:block;width:max(100%,1080px);height:auto}
.legcid{text-align:center;margin:6px 0 8px;font-size:13px}
.pr{cursor:pointer}.pr:active{opacity:.8}
.fum circle{animation:fum 4s linear infinite;opacity:0;transform-box:fill-box;transform-origin:center}

.pisca{animation:pisca 3s ease-in-out infinite}@keyframes pisca{0%,100%{opacity:1}50%{opacity:.55}}
.gira{animation:gira 6s linear infinite}.gira.lento{animation-duration:9s}@keyframes gira{to{transform:rotate(360deg)}}
.bandeira{animation:band 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}@keyframes band{50%{transform:scaleX(.82) skewY(4deg)}}
.sobe{animation:sobe 1.2s ease-in-out infinite}@keyframes sobe{50%{transform:translateY(-3px)}}

#abertura{position:fixed;inset:0;z-index:10001;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(ellipse at 50% 35%,#3a2216 0%,#120d0c 45%,#05060a 80%);color:#fff;text-align:center;padding:24px;transition:opacity .5s}

.arena{position:relative;border-radius:16px;padding:8px 6px;margin:6px 0 8px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 50%,#3a2418 0%,#1a1414 45%,#07080c 100%);border:1px solid #f2b70544;box-shadow:inset 0 0 40px #000c}
.arena::before{content:'';position:absolute;inset:auto 0 0 0;height:46%;background:repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 38px),linear-gradient(180deg,transparent,#0006);pointer-events:none}

.arena .lt b{font-size:12px;color:#f3efe6}.arena .lt small{font-size:11px}.arena .lt .int{color:#ffd36b;font-size:11px}
.ltfig{width:100%;max-width:78px;margin:0 auto;filter:drop-shadow(0 4px 6px #000a)}.ltfig svg{width:100%;height:auto;display:block}
.hpbar{position:relative;width:92%;height:8px;border-radius:5px;background:#0b0d12;border:1px solid #ffffff22;overflow:hidden;margin:3px 0 1px}
.hpbar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.hpbar .fant{background:#ffd36b;animation:fant .6s .15s ease-out forwards;width:var(--de)}
@keyframes fant{to{width:var(--ate)}}
.log{position:relative;height:auto;min-height:62px;border:0;padding:6px 40px 6px 8px;margin:6px 0;background:#0009;border-radius:10px;border:1px solid #ffffff12;font-size:13px}
.log p:first-child{color:#ffd36b}
.vs{position:absolute;right:8px;top:4px;font-family:Cinzel,Georgia,serif;font-weight:800;color:#f2b70566;font-size:18px}
.lt.ator{border-color:#f2b705;box-shadow:0 0 0 2px #f2b70566,0 0 22px #f2b70544;z-index:2}
.lt.ator.her{animation:avancaCima .42s ease-out}.lt.ator.ini{animation:avancaBaixo .42s ease-out}
@keyframes avancaCima{40%{transform:translateY(-14px) scale(1.06)}100%{transform:none}}
@keyframes avancaBaixo{40%{transform:translateY(14px) scale(1.06)}100%{transform:none}}
.lt.ator.sup{box-shadow:0 0 0 3px #fff,0 0 34px #ffd36b}
.lt.atingido .ltfig{animation:treme .35s linear}
@keyframes treme{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.lt.atingido::after{content:'';position:absolute;inset:0;border-radius:12px;background:#e0352b;opacity:0;animation:clarao .35s ease-out;pointer-events:none}
.lt.curado::after{content:'';position:absolute;inset:0;border-radius:12px;background:#3ddc6a;opacity:0;animation:clarao .5s ease-out;pointer-events:none}
@keyframes clarao{0%{opacity:.45}100%{opacity:0}}
.lt.cai .ltfig{animation:cai .5s ease-in forwards}@keyframes cai{to{transform:translateY(10px) rotate(-12deg);opacity:.35}}
.lt.morto .ltfig{filter:grayscale(1) brightness(.5)}
.dmg{position:absolute;left:50%;top:28%;transform:translateX(-50%);z-index:5;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 #8e1b14,0 0 10px #e0352b;animation:sobeDano .9s ease-out forwards;pointer-events:none;white-space:nowrap}
.dmg.crit{font-size:27px;color:#ffd36b;text-shadow:0 2px 0 #7a3b00,0 0 14px #ff7a1a}
.dmg.cura{color:#bfffd2;text-shadow:0 2px 0 #0d5a2a,0 0 10px #3ddc6a}
@keyframes sobeDano{0%{opacity:0;transform:translate(-50%,8px) scale(.6)}20%{opacity:1;transform:translate(-50%,-4px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-34px) scale(1)}}
.fx{position:absolute;left:50%;top:34%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;z-index:4;pointer-events:none;animation:explode .5s ease-out forwards}
.fx-termico{background:radial-gradient(circle,#fff6c8 0%,#ff9a2a 30%,#e0352b 55%,transparent 70%)}
.fx-hidraulico{background:radial-gradient(circle,#ffffff 0%,#6fd3ff 30%,#1f6fd1 55%,transparent 70%)}
.fx-pneumatico{background:radial-gradient(circle,transparent 30%,#e8fbff 38%,transparent 46%,#9fe3ff 56%,transparent 66%)}
.fx-estrutural{background:conic-gradient(from 20deg,#c9a36b 0 10%,transparent 0 20%,#8a6a45 0 30%,transparent 0 40%,#c9a36b 0 50%,transparent 0 60%,#8a6a45 0 70%,transparent 0 80%,#c9a36b 0 90%,transparent 0);-webkit-mask:radial-gradient(circle,transparent 25%,#000 30%,#000 60%,transparent 66%);mask:radial-gradient(circle,transparent 25%,#000 30%,#000 60%,transparent 66%)}
@keyframes explode{0%{transform:scale(.2);opacity:1}70%{opacity:.9}100%{transform:scale(1.25);opacity:0}}
.supflash{animation:tremeTela .45s linear}
.supflash::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:0;animation:clarao .6s ease-out;z-index:6}
.supflash.sys-termico::after{background:radial-gradient(circle,#ffb04a,#e0352b88)}.supflash.sys-hidraulico::after{background:radial-gradient(circle,#bfeaff,#1f6fd188)}
.supflash.sys-pneumatico::after{background:radial-gradient(circle,#ffffff,#9fe3ff88)}.supflash.sys-estrutural::after{background:radial-gradient(circle,#ffe2a8,#8a6a4588)}
@keyframes tremeTela{15%{transform:translate(-6px,3px)}30%{transform:translate(6px,-3px)}45%{transform:translate(-4px,-2px)}60%{transform:translate(4px,2px)}80%{transform:translate(-2px,1px)}}
.banner{position:absolute;left:0;right:0;top:38%;z-index:8;text-align:center;font-family:Cinzel,Georgia,serif;font-weight:800;font-size:44px;letter-spacing:4px;pointer-events:none;animation:banner 1.2s cubic-bezier(.2,1.4,.4,1) both}

@media (prefers-reduced-motion:reduce){.lt.ator,.lt.atingido .ltfig,.dmg,.fx,.supflash,.banner,.ffig svg,.cenafig svg,.gtile .gfig svg,.ffig::before,.ficha,.hpbar .fant{animation:none!important}}
